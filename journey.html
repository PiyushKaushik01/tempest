<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>The Chamber of Paths</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #020605;
      --text-color: #aaddff;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      overflow: hidden;
      font-family: 'Cinzel', serif;
      color: var(--text-color);
      user-select: none;
    }

    #webgl-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #loading-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 2s ease-in-out;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 1px solid rgba(170, 221, 255, 0.2);
      border-top: 1px solid var(--text-color);
      border-radius: 50%;
      animation: spin 1.5s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    #ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 0;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: rgba(170, 221, 255, 0.4);
      margin: 0;
      font-weight: 400;
    }

    #instruction {
      font-size: 0.8rem;
      letter-spacing: 0.4em;
      color: rgba(170, 221, 255, 0.6);
      animation: pulse 3s infinite alternate;
    }

    @keyframes pulse {
      0% {
        opacity: 0.3;
      }

      100% {
        opacity: 0.9;
      }
    }

    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, transparent 30%, rgba(2, 6, 5, 0.95) 100%);
      pointer-events: none;
      z-index: 5;
    }

    #transition-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 200;
    }

    .back-btn {
      position: fixed;
      top: clamp(15px, 3vh, 30px);
      left: clamp(15px, 4vw, 40px);
      z-index: 100;
      color: var(--primary-gold);
      text-decoration: none;
      border: 1px solid var(--primary-gold);
      padding: clamp(6px, 1.2vh, 10px) clamp(12px, 2vw, 22px);
      font-size: clamp(0.7rem, 1.2vw, 0.85rem);
      letter-spacing: 2px;
      text-transform: uppercase;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(5px);
      transition: all 0.3s ease;
    }

    .back-btn:hover {
      background: var(--primary-gold);
      color: var(--bg-dark);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
    }
  </style>
</head>
<script src="audio-controller.js"></script>

<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="letter-spacing: 4px; font-size: 0.8rem; color: rgba(170,221,255,0.5);">GENERATING TEXTURES</div>
  </div>
  <button onclick="smartReturn()" class="back-btn">&#8592; Return</button>
  <div id="webgl-container"></div>
  <div class="vignette"></div>

  <div id="ui-layer">
    <h1>The Chamber of Paths</h1>
    <div id="instruction">CHOOSE YOUR DESTINATION</div>
  </div>

  <div id="transition-overlay"></div>

  <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js"
        }
    }
    </script>

  <script type="module">

    import * as THREE from 'three';

    // --- GLOBAL VARIABLES ---
    let scene, camera, renderer;
    let doorInteractables = [];
    let torches = [];
    let dustParticles;
    let raycaster, mouse;

    let isTransitioning = false;
    let hoveredDoorGroup = null;
    let selectedDoorGroup = null; // Track permanently opened door
    let time = 0;

    let baseCameraPos = new THREE.Vector3();
    let currentCameraPos = new THREE.Vector3();
    let targetCameraPos = new THREE.Vector3();

    const baseLookAt = new THREE.Vector3(0, 7.8, -13);
    let currentLookAt = new THREE.Vector3().copy(baseLookAt);
    let targetLookAt = new THREE.Vector3().copy(baseLookAt);

    updateCameraSettingsForScreen(true);

    function updateCameraSettingsForScreen(isInit = false) {
      const aspect = window.innerWidth / window.innerHeight;
      let targetZ = 22;
      let targetY = 6.8;

      if (aspect < 1) {
        targetZ = 22 / aspect * 0.84;
        targetY = 6.8 + (1 - aspect) * 1.8;
      }

      baseCameraPos.set(0, targetY, targetZ);
      if (isInit) {
        currentCameraPos.copy(baseCameraPos);
        targetCameraPos.copy(baseCameraPos);
      } else {
        targetCameraPos.copy(baseCameraPos);
      }
    }

    // --- PROCEDURAL TEXTURE GENERATOR ---
    const TextureGen = {
      createStone(isBump = false) {
        const canvas = document.createElement('canvas');
        canvas.width = 1024; canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = isBump ? '#888888' : '#4b4b46';
        ctx.fillRect(0, 0, 1024, 1024);

        for (let i = 0; i < 150000; i++) {
          const v = Math.random();
          if (isBump) {
            ctx.fillStyle = v > 0.5 ? '#999999' : '#777777';
          } else {
            ctx.fillStyle = v > 0.8 ? '#64645d' : (v < 0.2 ? '#30312e' : '#50504a');
          }
          ctx.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
        }

        ctx.strokeStyle = isBump ? '#000000' : '#20211e';
        ctx.lineWidth = 4;
        for (let y = 0; y < 1024; y += 128) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
          for (let x = 0; x < 1024; x += 256) {
            const offset = (y / 128) % 2 === 0 ? 0 : 128;
            ctx.beginPath(); ctx.moveTo(x + offset, y); ctx.lineTo(x + offset, y + 128); ctx.stroke();
          }
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(6, 3);
        return tex;
      },

      createFloor(isBump = false) {
        const canvas = document.createElement('canvas');
        canvas.width = 2048; canvas.height = 2048;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = isBump ? '#888888' : '#41423f';
        ctx.fillRect(0, 0, 2048, 2048);

        for (let i = 0; i < 300000; i++) {
          const v = Math.random();
          ctx.fillStyle = isBump ? (v > 0.5 ? '#999' : '#777') : (v > 0.8 ? '#595a55' : '#383a37');
          ctx.fillRect(Math.random() * 2048, Math.random() * 2048, 3, 3);
        }

        ctx.strokeStyle = isBump ? '#000000' : '#20211e';
        ctx.lineWidth = 12;
        const c = 1024;
        for (let r = 200; r < 1800; r += 250) {
          ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.stroke();
        }

        ctx.lineWidth = 8;
        for (let a = 0; a < Math.PI * 2; a += Math.PI / 12) {
          ctx.beginPath(); ctx.moveTo(c, c);
          ctx.lineTo(c + Math.cos(a) * 1800, c + Math.sin(a) * 1800);
          ctx.stroke();
        }

        ctx.lineWidth = 4;
        for (let i = 0; i < 50; i++) {
          ctx.beginPath();
          let cx = Math.random() * 2048, cy = Math.random() * 2048;
          ctx.moveTo(cx, cy);
          for (let j = 0; j < 5; j++) {
            cx += (Math.random() - 0.5) * 100; cy += (Math.random() - 0.5) * 100;
            ctx.lineTo(cx, cy);
          }
          ctx.stroke();
        }

        return new THREE.CanvasTexture(canvas);
      },

      createWood(isBump = false) {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = isBump ? '#888888' : '#281710';
        ctx.fillRect(0, 0, 512, 1024);

        for (let i = 0; i < 5000; i++) {
          ctx.fillStyle = isBump ? (Math.random() > 0.5 ? '#888' : '#777') : (Math.random() > 0.5 ? '#20120b' : '#331f15');
          ctx.fillRect(Math.random() * 512, Math.random() * 1024, 2, 80 + Math.random() * 220);
        }

        return new THREE.CanvasTexture(canvas);
      },

      createGodRayAlpha() {
        const canvas = document.createElement('canvas');
        canvas.width = 512; canvas.height = 512;
        const ctx = canvas.getContext('2d');

        const grd = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
        grd.addColorStop(0, 'rgba(255, 255, 255, 1)');
        grd.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
        grd.addColorStop(1, 'rgba(255, 255, 255, 0)');

        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, 512, 512);

        return new THREE.CanvasTexture(canvas);
      }
    };

    // --- INITIALIZATION ---
    init();
    animate();

    function init() {
      const container = document.getElementById('webgl-container');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x10110f);
      scene.fog = new THREE.FogExp2(0x151614, 0.011);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
      camera.position.copy(currentCameraPos);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.32;
      container.appendChild(renderer.domElement);

      buildLighting();
      buildArchitecture();
      buildDoors();
      buildRemains();
      buildParticles();

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('mousedown', onMouseDown);
      window.addEventListener('touchstart', onTouchStart, { passive: false });

      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 2000);
      }, 1500);
    }

    // --- ENVIRONMENT BUILDING ---

    function buildLighting() {
      const hemiLight = new THREE.HemisphereLight(0xa5acab, 0x2b2d29, 1.95);
      scene.add(hemiLight);

      const spotLight = new THREE.SpotLight(0xd4dfdd, 12000);
      spotLight.position.set(0, 38, -8);
      spotLight.target.position.set(0, 0, -16);
      spotLight.angle = Math.PI / 7;
      spotLight.penumbra = 0.92;
      spotLight.decay = 2.0;
      spotLight.distance = 150;
      spotLight.castShadow = true;
      spotLight.shadow.mapSize.width = 2048;
      spotLight.shadow.mapSize.height = 2048;
      spotLight.shadow.bias = -0.001;
      scene.add(spotLight);
      scene.add(spotLight.target);

      const shaftGeo = new THREE.CylinderGeometry(3.6, 10.5, 42, 32, 1, true);
      const shaftMat = new THREE.MeshBasicMaterial({
        color: 0xd8e4e0,
        transparent: true,
        opacity: 0.07,
        blending: THREE.NormalBlending,
        side: THREE.DoubleSide,
        depthWrite: false,
        alphaMap: TextureGen.createGodRayAlpha()
      });
      const shaft = new THREE.Mesh(shaftGeo, shaftMat);
      shaft.position.set(0, 20, -14);
      scene.add(shaft);
    }

    function buildArchitecture() {
      const stoneDiff = TextureGen.createStone();
      const stoneBump = TextureGen.createStone(true);
      const floorDiff = TextureGen.createFloor();
      const floorBump = TextureGen.createFloor(true);

      const floorMat = new THREE.MeshStandardMaterial({
        map: floorDiff,
        bumpMap: floorBump,
        bumpScale: 0.15,
        roughness: 0.9,
        metalness: 0.1
      });

      const wallMat = new THREE.MeshStandardMaterial({
        map: stoneDiff,
        bumpMap: stoneBump,
        bumpScale: 0.1,
        roughness: 0.95,
        metalness: 0.0
      });

      const floorGeo = new THREE.CylinderGeometry(40, 40, 1, 64);
      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.position.y = -0.5;
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      const wallGeo = new THREE.CylinderGeometry(34, 34, 42, 48, 1, true);
      const wall = new THREE.Mesh(wallGeo, wallMat);
      wall.material.side = THREE.BackSide;
      wall.position.y = 21;
      wall.receiveShadow = true;
      scene.add(wall);

      const ledgeGeo = new THREE.TorusGeometry(33, 1.25, 16, 64);
      const ledge = new THREE.Mesh(ledgeGeo, wallMat);
      ledge.position.y = 17.5;
      ledge.rotation.x = Math.PI / 2;
      ledge.receiveShadow = true;
      scene.add(ledge);

      const frameGeo = new THREE.BoxGeometry(7, 32, 7);
      const frameLeft = new THREE.Mesh(frameGeo, wallMat);
      frameLeft.position.set(-20, 16, 16);
      const frameRight = new THREE.Mesh(frameGeo, wallMat);
      frameRight.position.set(20, 16, 16);
      scene.add(frameLeft, frameRight);
    }

    function buildDoors() {
      const radius = 32.9;
      const doorsConfig = [
        { id: 'members', label: "MEMBER REGISTRY", url: "members.html", angle: -0.52, scale: 1.22 },
        { id: 'about', label: "ABOUT THE KINGDOM", url: "about.html", angle: 0, scale: 1.34 },
        { id: 'support', label: "ROYAL SUPPORT", url: "support.html", angle: 0.52, scale: 1.22 }
      ];

      const stoneDiff = TextureGen.createStone();
      const stoneBump = TextureGen.createStone(true);
      const woodDiff = TextureGen.createWood();
      const woodBump = TextureGen.createWood(true);

      const stoneMat = new THREE.MeshStandardMaterial({ map: stoneDiff, bumpMap: stoneBump, bumpScale: 0.05, roughness: 0.9 });
      const woodMat = new THREE.MeshStandardMaterial({ map: woodDiff, bumpMap: woodBump, bumpScale: 0.1, roughness: 0.8 });
      const ironMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5, metalness: 0.85 });

      doorsConfig.forEach(config => {
        const group = new THREE.Group();
        group.position.x = Math.sin(config.angle) * radius;
        group.position.z = -Math.cos(config.angle) * radius;
        group.rotation.y = config.id === 'members' ? THREE.MathUtils.degToRad(30)
          : config.id === 'support' ? -THREE.MathUtils.degToRad(30) : 0;
        group.scale.setScalar(config.scale);

        const frameGroup = new THREE.Group();
        const pL = new THREE.Mesh(new THREE.BoxGeometry(2.0, 16, 1.2), stoneMat);
        pL.position.set(-4.0, 8, 0);
        const pR = new THREE.Mesh(new THREE.BoxGeometry(2.0, 16, 1.2), stoneMat);
        pR.position.set(4.0, 8, 0);

        const arch = new THREE.Mesh(new THREE.TorusGeometry(4.0, 1.0, 8, 18, Math.PI), stoneMat);
        arch.position.set(0, 16.0, 0);

        const backing = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 20), new THREE.MeshStandardMaterial({ color: 0x050504, roughness: 1 }));
        backing.position.set(0, 10.0, -0.2);

        frameGroup.add(pL, pR, arch, backing);
        frameGroup.castShadow = true;
        group.add(frameGroup);

        const doorGroup = new THREE.Group();
        doorGroup.position.set(-3.1, 0, 0.12);

        const leftLeaf = new THREE.Group();
        leftLeaf.position.set(0, 0, 0);

        const plankCount = 4;
        const totalWidth = 6.2;
        const plankWidth = totalWidth / plankCount;
        const doorMeshes = [];

        const archCenterY = 16.0;
        const archRadius = 3.1;

        for (let p = 0; p < plankCount; p++) {
          const xMin = (p * plankWidth) + 0.02;
          const xMax = ((p + 1) * plankWidth) - 0.02;

          const shape = new THREE.Shape();
          shape.moveTo(xMin, 0);
          shape.lineTo(xMax, 0);
          shape.lineTo(xMax, archCenterY);

          const thetaMax = Math.acos(Math.max(-1, Math.min(1, (xMax - 3.1) / archRadius)));
          const thetaMin = Math.acos(Math.max(-1, Math.min(1, (xMin - 3.1) / archRadius)));

          shape.absarc(3.1, archCenterY, archRadius, thetaMax, thetaMin, false);
          shape.lineTo(xMin, 0);

          const plankGeo = new THREE.ExtrudeGeometry(shape, {
            depth: 0.55,
            bevelEnabled: true,
            bevelSegments: 2,
            steps: 1,
            bevelSize: 0.03,
            bevelThickness: 0.03
          });

          const plank = new THREE.Mesh(plankGeo, woodMat);
          plank.position.set(0, 0, -0.22);
          plank.castShadow = true;
          plank.receiveShadow = true;
          leftLeaf.add(plank);
          doorMeshes.push(plank);
        }

        [3.5, 13.0].forEach(yPos => {
          const strap = new THREE.Mesh(new THREE.BoxGeometry(6.3, 0.75, 0.75), ironMat);
          strap.position.set(3.1, yPos, 0.35);
          strap.castShadow = true;
          leftLeaf.add(strap);

          for (let rx = 0.8; rx < 5.8; rx += 1.4) {
            const rivet = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 8), ironMat);
            rivet.position.set(rx, yPos, 0.75);
            leftLeaf.add(rivet);
          }
        });

        const ringGeo = new THREE.TorusGeometry(.5, .1, 8, 24);
        const singleRing = new THREE.Mesh(ringGeo, ironMat);

        let handleX = 3.1;
        if (config.id === 'members') {
          handleX = 4.6;
        } else if (config.id === 'support') {
          handleX = 1.6;
        }

        singleRing.position.set(handleX, 8.2, .45);
        leftLeaf.add(singleRing);

        const sharedDoorData = { url: config.url, isDoor: true, parentGroup: doorGroup, baseZ: 0.12, leaves: [leftLeaf] };
        doorMeshes.forEach(mesh => {
          mesh.userData = { ...sharedDoorData, leaf: leftLeaf, leafDirection: 1 };
          doorInteractables.push(mesh);
        });

        const doorHitbox = new THREE.Mesh(
          new THREE.BoxGeometry(6.25, 19.5, .04),
          new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false })
        );
        doorHitbox.position.set(3.1, 9.5, .84);
        doorHitbox.userData = { ...sharedDoorData, isProxy: true };
        doorInteractables.push(doorHitbox);

        doorGroup.add(leftLeaf, doorHitbox);
        group.add(doorGroup);

        const canvas = document.createElement('canvas');
        canvas.width = 2048; canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#16130e';
        ctx.fillRect(0, 0, 2048, 512);
        ctx.strokeStyle = '#a4834d'; ctx.lineWidth = 10;
        ctx.strokeRect(10, 10, 2028, 492);
        ctx.font = 'bold 126px "Cinzel", Georgia, serif';
        ctx.fillStyle = '#fff0bf';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(config.label, 1024, 256);

        const tex = new THREE.CanvasTexture(canvas);
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const labelMat = new THREE.MeshBasicMaterial({ map: tex, fog: false });
        const labelMesh = new THREE.Mesh(new THREE.PlaneGeometry(6.9, 1.35), labelMat);
        labelMesh.position.set(0, 18.55, 1.25);

        doorMeshes.forEach(mesh => { mesh.userData.labelMat = labelMat; });
        doorHitbox.userData.labelMat = labelMat;
        group.add(labelMesh);

        addTorch(group);

        scene.add(group);
      });
    }

    function addTorch(parentGroup) {
      const torchGroup = new THREE.Group();
      torchGroup.position.set(0, 20.2, 1.15);

      const bracket = new THREE.Mesh(
        new THREE.BoxGeometry(0.8, 0.8, 0.8),
        new THREE.MeshStandardMaterial({ color: 0x050505 })
      );
      torchGroup.add(bracket);

      const fireLight = new THREE.PointLight(0xffa94d, 420, 26, 2);
      fireLight.position.set(0, 0.5, 0.5);
      fireLight.castShadow = true;
      torchGroup.add(fireLight);

      torches.push({
        light: fireLight,
        baseIntensity: 360 + Math.random() * 70,
        phase: Math.random() * Math.PI * 2
      });

      parentGroup.add(torchGroup);
    }

    function buildRemains() {
      const boneMat = new THREE.MeshStandardMaterial({ color: 0x9b9277, roughness: .94 });
      const socketMat = new THREE.MeshBasicMaterial({ color: 0x151512 });
      const remainsGroup = new THREE.Group();

      function makeSkull(scale) {
        const skull = new THREE.Group();
        const cranium = new THREE.Mesh(new THREE.SphereGeometry(.48, 14, 10), boneMat);
        cranium.scale.set(1, .88, 1.04); skull.add(cranium);
        const face = new THREE.Mesh(new THREE.BoxGeometry(.42, .31, .35), boneMat);
        face.position.set(0, -.21, .32); skull.add(face);
        const jaw = new THREE.Mesh(new THREE.BoxGeometry(.4, .11, .28), boneMat);
        jaw.position.set(0, -.43, .2); skull.add(jaw);
        [-.16, .16].forEach(x => {
          const socket = new THREE.Mesh(new THREE.SphereGeometry(.095, 10, 8), socketMat);
          socket.position.set(x, .02, .43); skull.add(socket);
        });
        skull.scale.setScalar(scale);
        return skull;
      }

      function makeBone(length) {
        const bone = new THREE.Group();
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, length, 8), boneMat);
        shaft.rotation.z = Math.PI / 2; bone.add(shaft);
        [-length / 2, length / 2].forEach(x => {
          const end = new THREE.Mesh(new THREE.SphereGeometry(.13, 9, 7), boneMat);
          end.position.x = x; end.scale.set(1.15, .78, .82); bone.add(end);
        });
        return bone;
      }

      for (let i = 0; i < 38; i++) {
        const r = 5 + Math.random() * 14;
        const theta = Math.random() * Math.PI * 2;

        if (Math.abs(theta) < 0.5 && r > 8) continue;

        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r - 5;

        if (Math.random() > 0.67) {
          const skull = makeSkull(.78 + Math.random() * .32);
          skull.position.set(x, .38, z);
          skull.rotation.set(0, Math.random() * Math.PI * 2, (Math.random() - .5) * .18);
          skull.traverse(m => { if (m.isMesh) m.castShadow = true; });
          remainsGroup.add(skull);
        } else {
          const bone = makeBone(.9 + Math.random() * .9);
          bone.position.set(x, .16, z);
          bone.rotation.set((Math.random() - .5) * .18, Math.random() * Math.PI, (Math.random() - .5) * .12);
          bone.traverse(m => { if (m.isMesh) m.castShadow = true; });
          remainsGroup.add(bone);
        }
      }
      scene.add(remainsGroup);
    }

    function buildParticles() {
      const particleCount = 400;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(particleCount * 3);

      for (let i = 0; i < particleCount * 3; i += 3) {
        const r = Math.random() * 12;
        const theta = Math.random() * Math.PI * 2;
        pos[i] = Math.cos(theta) * r;
        pos[i + 1] = Math.random() * 80;
        pos[i + 2] = (Math.sin(theta) * r) - 5;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

      const mat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.16,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      dustParticles = new THREE.Points(geo, mat);
      scene.add(dustParticles);
    }

    // --- INTERACTION ---

    function onMouseMove(event) {
      if (isTransitioning) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      targetLookAt.x = baseLookAt.x + (mouse.x * 2.5);
      targetLookAt.y = baseLookAt.y + (mouse.y * 1.5);
      targetCameraPos.x = baseCameraPos.x + (mouse.x * 1.5);

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(doorInteractables);

      if (intersects.length > 0) {
        const object = intersects[0].object;
        if (hoveredDoorGroup !== object) {
          resetHover();
          hoveredDoorGroup = object;
          document.body.style.cursor = 'pointer';
          if (window.playHoverSound) window.playHoverSound();
          if (object.material.emissive) object.material.emissive.setHex(0x1a1100);
          object.userData.labelMat.color.setHex(0xffd982);
        }
      } else {
        if (hoveredDoorGroup) resetHover();
      }
    }

    function resetHover() {
      if (hoveredDoorGroup) {
        if (hoveredDoorGroup.material.emissive) hoveredDoorGroup.material.emissive.setHex(0x000000);
        hoveredDoorGroup.userData.labelMat.color.setHex(0xffffff);
        hoveredDoorGroup = null;
        document.body.style.cursor = 'default';
      }
    }

    function onTouchStart(event) {
      if (isTransitioning) return;
      mouse.x = (event.touches[0].clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.touches[0].clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(doorInteractables);
      if (intersects.length > 0) {
        hoveredDoorGroup = intersects[0].object;
        triggerDoorSelection();
      }
    }

    function onMouseDown(event) {
      if (hoveredDoorGroup) {
        triggerDoorSelection();
      }
    }

    function triggerDoorSelection() {
      if (isTransitioning || !hoveredDoorGroup) return;
      isTransitioning = true;
      selectedDoorGroup = hoveredDoorGroup; // Keep track of opened door

      // Play gate open sound effect
      if (window.playGateOpenSound) window.playGateOpenSound();

      document.body.style.cursor = 'default';
      document.getElementById('ui-layer').style.opacity = '0';

      const targetUrl = hoveredDoorGroup.userData.url;
      const doorWorldPos = new THREE.Vector3();
      hoveredDoorGroup.getWorldPosition(doorWorldPos);

      const direction = new THREE.Vector3().subVectors(doorWorldPos, camera.position).normalize();
      targetCameraPos.copy(doorWorldPos).sub(direction.multiplyScalar(12));
      targetLookAt.copy(doorWorldPos);

      hoveredDoorGroup.position.z = hoveredDoorGroup.userData.baseZ - 1.5;

      setTimeout(() => {
        document.getElementById('transition-overlay').style.opacity = '1';
      }, 800);

      setTimeout(() => {
        window.location.href = targetUrl;
      }, 2500);
    }

    function onWindowResize() {
      updateCameraSettingsForScreen(false);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- RENDER LOOP ---

    function animate() {
      requestAnimationFrame(animate);
      time += 0.01;

      if (!isTransitioning) {
        const breathY = Math.sin(time * 1.2) * 0.2;
        currentCameraPos.lerp(
          new THREE.Vector3(targetCameraPos.x, targetCameraPos.y + breathY, targetCameraPos.z),
          0.03
        );
      } else {
        currentCameraPos.lerp(targetCameraPos, 0.02);
      }

      camera.position.copy(currentCameraPos);
      currentLookAt.lerp(targetLookAt, 0.04);
      camera.lookAt(currentLookAt);

      torches.forEach(t => {
        t.light.intensity = t.baseIntensity + Math.sin(time * 14 + t.phase) * 35 + Math.random() * 18;
      });

      if (dustParticles) {
        const positions = dustParticles.geometry.attributes.position.array;
        for (let i = 1; i < positions.length; i += 3) {
          positions[i] += 0.03;
          if (positions[i] > 80) positions[i] = 0;
        }
        dustParticles.geometry.attributes.position.needsUpdate = true;
      }

      doorInteractables.forEach(door => {
        if (door.userData.isProxy) return;
        const isSelected = selectedDoorGroup && selectedDoorGroup.userData.parentGroup === door.userData.parentGroup;
        const sameBayIsHovered = hoveredDoorGroup &&
          hoveredDoorGroup.userData.parentGroup === door.userData.parentGroup;
        
        // Gate stays open if selected/clicked OR if currently hovered
        const targetAngle = (isSelected || (sameBayIsHovered && !isTransitioning))
          ? door.userData.leafDirection * .72 : 0;
        door.userData.leaf.rotation.y += (targetAngle - door.userData.leaf.rotation.y) * .11;
      });

      renderer.render(scene, camera);
    }

    window.addEventListener('pageshow', (event) => {
      if (event.persisted) {
        window.location.reload();
      }
    });

  </script>
  <script>
    function smartReturn() {
      if (document.referrer && document.referrer !== window.location.href) {
        window.history.back();
      } else {
        window.location.href = 'index.html';
      }
    }
  </script>
