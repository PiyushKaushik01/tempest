<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Us</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #010a08;
            font-family: 'Georgia', serif;
        }
        
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        h1 {
            color: #ffdf70;
            font-size: 5vw;
            font-weight: bold;
            text-align: center;
            letter-spacing: 2px;
            margin: 0;
            background: transparent; 
            text-shadow: 
                0 4px 10px rgba(0, 0, 0, 1),
                0 8px 20px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(0, 0, 0, 0.9);
        }

        @media (max-width: 768px) {
            h1 { font-size: 8vw; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="ui-layer">
        <h1>We're rich don't worry :)</h1>
    </div>

    <!-- Import modern Three.js and Addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ==========================================
        // 1. SCENE SETUP
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010a08);
        scene.fog = new THREE.FogExp2(0x010a08, 0.006);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 80); 
        camera.lookAt(0, -5, -40);

        const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        container.appendChild(renderer.domElement);

        // ==========================================
        // 2. INSTANT PROCEDURAL TEXTURE
        // ==========================================
        const texSize = 256;
        const texData = new Uint8Array(texSize * texSize * 4);
        for (let i = 0; i < texSize * texSize * 4; i += 4) {
            const val = Math.floor(Math.random() * 255);
            texData[i] = val; texData[i+1] = val; texData[i+2] = val; texData[i+3] = 255;
        }
        const coinBumpMap = new THREE.DataTexture(texData, texSize, texSize);
        coinBumpMap.needsUpdate = true;
        coinBumpMap.wrapS = THREE.RepeatWrapping;
        coinBumpMap.wrapT = THREE.RepeatWrapping;
        coinBumpMap.repeat.set(40, 40);

        // ==========================================
        // 3. MATERIALS
        // ==========================================
        const pillarBaseMat = new THREE.MeshStandardMaterial({ color: 0x052e28, roughness: 0.7, metalness: 0.1 });
        const pillarAccentMat = new THREE.MeshStandardMaterial({ color: 0x4a1c1c, roughness: 0.8 });
        
        const goldMat = new THREE.MeshStandardMaterial({ 
            color: 0xffaa00, 
            metalness: 0.8, 
            roughness: 0.3,
            bumpMap: coinBumpMap,
            bumpScale: 0.15,
            emissive: 0x221100, 
            emissiveIntensity: 0.5
        });
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x031210, roughness: 0.9 });
        const obsidianMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.2 });

        // ==========================================
        // 4. ARCHITECTURE (Pillars)
        // ==========================================
        const baseGeo = new THREE.BoxGeometry(7, 8, 7);
        const accentGeo1 = new THREE.BoxGeometry(7.2, 2, 7.2);
        const shaftGeo1 = new THREE.BoxGeometry(6, 20, 6);
        const accentGeo2 = new THREE.BoxGeometry(6.5, 3, 6.5);
        const shaftGeo2 = new THREE.BoxGeometry(5.5, 40, 5.5);
        const sconceGeo = new THREE.SphereGeometry(1.2, 8, 8, 0, Math.PI * 2, 0, Math.PI / 2);
        const sconceMat = new THREE.MeshStandardMaterial({ color: 0xffeedd, emissive: 0xffcc77, emissiveIntensity: 2 });

        function createPillar(x, z) {
            const pillarGroup = new THREE.Group();
            const base = new THREE.Mesh(baseGeo, pillarBaseMat);
            base.position.y = 4;
            base.castShadow = true; base.receiveShadow = true;
            pillarGroup.add(base);

            const accent1 = new THREE.Mesh(accentGeo1, pillarAccentMat);
            accent1.position.y = 9;
            accent1.castShadow = true;
            pillarGroup.add(accent1);

            const shaft1 = new THREE.Mesh(shaftGeo1, pillarBaseMat);
            shaft1.position.y = 20;
            shaft1.castShadow = true; shaft1.receiveShadow = true;
            pillarGroup.add(shaft1);

            const accent2 = new THREE.Mesh(accentGeo2, pillarAccentMat);
            accent2.position.y = 31.5;
            accent2.castShadow = true;
            pillarGroup.add(accent2);

            const shaft2 = new THREE.Mesh(shaftGeo2, pillarBaseMat);
            shaft2.position.y = 53;
            shaft2.castShadow = true; shaft2.receiveShadow = true;
            pillarGroup.add(shaft2);

            const sconceOffset = 3.2;
            [
                { px: 0, pz: sconceOffset, r: 0 },
                { px: sconceOffset, pz: 0, r: -Math.PI/2 },
                { px: -sconceOffset, pz: 0, r: Math.PI/2 }
            ].forEach(pos => {
                const sconce = new THREE.Mesh(sconceGeo, sconceMat);
                sconce.position.set(pos.px, 15, pos.pz);
                sconce.rotation.x = -Math.PI / 2;
                sconce.rotation.z = pos.r;
                pillarGroup.add(sconce);
            });

            pillarGroup.position.set(x, 0, z);
            scene.add(pillarGroup);
        }

        const pillarLocations = [
            [-25, 20], [25, 20], [-35, -20], [35, -20], [-40, -60], [40, -60], [-20, -100], [20, -100]
        ];
        pillarLocations.forEach(loc => createPillar(loc[0], loc[1]));

        const wallGroup = new THREE.Group();
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(200, 100, 10), stoneMat);
        backWall.position.set(0, 50, -130);
        wallGroup.add(wallGroup);
        scene.add(wallGroup);

        const archGeo = new THREE.TorusGeometry(15, 3, 8, 16, Math.PI);
        for(let i = -2; i <= 2; i++) {
            const arch = new THREE.Mesh(archGeo, stoneMat);
            arch.position.set(i * 35, 30, -125);
            wallGroup.add(arch);
        }

        const weightGeo = new THREE.ConeGeometry(5, 15, 4);
        [ [0, -30], [-30, -70], [30, -70], [0, -110] ].forEach(pos => {
            const weight = new THREE.Mesh(weightGeo, obsidianMat);
            weight.position.set(pos[0], 65, pos[1]);
            weight.rotation.x = Math.PI;
            scene.add(weight);
        });

        // ==========================================
        // 5. THE GOLD HOARD
        // ==========================================
        const floorGeo = new THREE.PlaneGeometry(250, 250, 80, 80);
        floorGeo.rotateX(-Math.PI / 2);
        
        function getFloorHeight(x, z) {
            let y = Math.sin(x * 0.05) * Math.cos(z * 0.05) * 8;
            y += Math.sin(x * 0.15 + z * 0.1) * 3;
            
            const distFromCenter = Math.abs(x);
            if (distFromCenter < 15) {
                y *= (distFromCenter / 15);
            }
            y += (Math.abs(z + 50) * 0.05);
            return Math.max(0, y);
        }

        const posAttribute = floorGeo.attributes.position;
        for (let i = 0; i < posAttribute.count; i++) {
            const x = posAttribute.getX(i);
            const z = posAttribute.getZ(i);
            posAttribute.setY(i, getFloorHeight(x, z));
        }
        floorGeo.computeVertexNormals();
        
        const goldFloor = new THREE.Mesh(floorGeo, goldMat);
        goldFloor.receiveShadow = true;
        goldFloor.castShadow = true;
        scene.add(goldFloor);

        // ==========================================
        // 6. SCATTERED TREASURE 
        // ==========================================
        const itemGeo = new THREE.CylinderGeometry(0.5, 0.5, 1, 5); 
        const itemCount = 2500;
        const instancedItems = new THREE.InstancedMesh(itemGeo, goldMat, itemCount);
        instancedItems.castShadow = true;
        
        const dummy = new THREE.Object3D();
        for(let i = 0; i < itemCount; i++) {
            const rx = (Math.random() - 0.5) * 180;
            const rz = (Math.random() - 0.5) * 180;
            const ry = getFloorHeight(rx, rz); 
            
            dummy.position.set(rx, ry + (Math.random() * 0.5), rz);
            dummy.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            const scale = Math.random() * 1.5 + 0.5;
            dummy.scale.set(scale, scale, scale);
            dummy.updateMatrix();
            instancedItems.setMatrixAt(i, dummy.matrix);
        }
        scene.add(instancedItems);

        // ==========================================
        // 7. LIGHTING
        // ==========================================
        const ambient = new THREE.AmbientLight(0x0a1a15, 0.8);
        scene.add(ambient);

        function addSpotlight(x, y, z, color, intensity) {
            const spot = new THREE.SpotLight(color, intensity);
            spot.position.set(x, y, z);
            spot.angle = Math.PI / 4.5;
            spot.penumbra = 0.8;
            spot.decay = 1.5;
            spot.distance = 200;
            spot.castShadow = true;
            spot.shadow.mapSize.width = 1024;
            spot.shadow.mapSize.height = 1024;
            spot.shadow.bias = -0.001; 
            scene.add(spot);
            
            const target = new THREE.Object3D();
            target.position.set(x, 0, z - 10);
            scene.add(target);
            spot.target = target;
        }

        addSpotlight(0, 90, -30, 0xffeebb, 15000); 
        addSpotlight(-30, 80, -60, 0xcceeff, 10000);
        addSpotlight(35, 85, -20, 0xffddaa, 12000);

        const rayShader = {
            uniforms: { color: { value: new THREE.Color(0xd0eaff) } },
            vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
            fragmentShader: `uniform vec3 color; varying vec2 vUv; void main() { float alpha = smoothstep(0.0, 0.3, vUv.y) * smoothstep(1.0, 0.6, vUv.y); alpha *= sin(vUv.x * 3.14159); gl_FragColor = vec4(color, alpha * 0.12); }`,
            transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide
        };

        const rayMat = new THREE.ShaderMaterial(rayShader);
        const rayGeo = new THREE.CylinderGeometry(15, 25, 100, 16, 1, true); 
        
        [
            { x: 0, z: -30, rx: 0.1, rz: 0 },
            { x: -20, z: -50, rx: 0.2, rz: -0.1 },
            { x: 25, z: -40, rx: 0.15, rz: 0.1 }
        ].forEach(data => {
            const shaft = new THREE.Mesh(rayGeo, rayMat);
            shaft.position.set(data.x, 45, data.z);
            shaft.rotation.set(data.rx, 0, data.rz);
            scene.add(shaft);
        });

     // ==========================================
// 8. ADD CRYO SLIME MODEL + EXTERNAL PNG TEXTURE
// ==========================================
const textureLoader = new THREE.TextureLoader();

// 1. Load the PNG file from your zip
const slimeTexture = textureLoader.load('texture.png'); 

// 2. glTF models require flipY = false for proper UV texture alignment
slimeTexture.flipY = false;
slimeTexture.colorSpace = THREE.SRGBColorSpace;

let slimeModel;
const gltfLoader = new GLTFLoader();

gltfLoader.load(
    'cryo_slime.glb', 
    function (gltf) {
        slimeModel = gltf.scene;
        slimeModel.scale.set(12, 12, 12);
        slimeModel.position.set(0, 8, -30);
        
        slimeModel.traverse((node) => {
            if (node.isMesh) {
                node.castShadow = true;
                node.receiveShadow = true;

                // 3. Attach the PNG texture directly to the material
                node.material = new THREE.MeshStandardMaterial({
                    map: slimeTexture,
                    roughness: 0.3,
                    metalness: 0.1,
                    // Self-illumination so the texture stays colorful in the dark vault
                    emissiveMap: slimeTexture,
                    emissive: new THREE.Color(0xffffff),
                    emissiveIntensity: 0.25,
                    transparent: true
                });
            }
        });

        scene.add(slimeModel);
    },
    undefined,
    function (error) {
        console.error('Error loading cryo_slime.glb:', error);
    }
);

        // ==========================================
        // 9. ANIMATION LOOP (Static, facing camera)
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Panning camera
            camera.position.x = Math.sin(time * 0.05) * 5;
            camera.lookAt(0, -5, -40);

            // Keep model static and locked facing the camera
            if (slimeModel) {
                slimeModel.lookAt(camera.position.x, slimeModel.position.y, camera.position.z);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
